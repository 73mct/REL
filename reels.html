<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Reels</title>
<style>
:root{--bg:#000;--fg:#fff;--w:100vw;--h:100vh;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#feed{height:var(--h);overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
section{position:relative;height:var(--h);width:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
body.fill video{object-fit:cover}
body.rot video{inset:auto;top:50%;left:50%;width:var(--h);height:var(--w);transform:translate(-50%,-50%) rotate(90deg)}
.cap{position:absolute;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.8;text-shadow:0 1px 4px #000;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;justify-content:center;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:linear-gradient(#000a,#0000);z-index:5}
.bar button,.big{background:#ffffff26;color:#fff;border:0;border-radius:20px;padding:9px 13px;font-size:15px;backdrop-filter:blur(6px)}
.bar button.on{background:#fff;color:#000}
.big{font-size:18px;padding:16px 26px;background:#fff;color:#000;font-weight:600}
#prog{position:fixed;left:0;bottom:0;height:3px;width:0;background:#fff;z-index:6}
#pp{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:64px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:4;text-shadow:0 2px 10px #000}
#pp.show{opacity:.9}
#empty{position:fixed;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:3;background:#000}
#empty p{opacity:.7;max-width:300px;line-height:1.4;margin:0}
input{display:none}
</style>
</head>
<body>
<div class="bar">
  <button id="bAdd">＋ Add</button>
  <button id="bShuf">🔀</button>
  <button id="bFit">Fit</button>
  <button id="bRot">⟳ Rotate</button>
  <button id="bMute">🔊</button>
</div>
<div id="feed"></div>
<div id="empty">
  <h1 style="margin:0">My Reels</h1>
  <p>Your videos stay on this phone. Nothing is uploaded.</p>
  <button class="big" id="bPick">Choose videos</button>
  <button class="big" id="bFolder" style="background:#ffffff26;color:#fff">Choose folder</button>
  <p style="font-size:12px">Folder picking works on Android Chrome. On iPhone, use “Choose videos” and select many at once.</p>
</div>
<div id="pp">▶</div>
<div id="prog"></div>
<input id="fVid" type="file" accept="video/*" multiple>
<input id="fDir" type="file" webkitdirectory multiple>
<script>
const $=id=>document.getElementById(id);
const feed=$('feed'),empty=$('empty'),pp=$('pp'),prog=$('prog');
let files=[],cur=0,muted=false;
const isVid=f=>(f.type&&f.type.startsWith('video/'))||/\.(mp4|mov|m4v|webm|mkv|3gp|avi)$/i.test(f.name);

function size(){const r=document.documentElement.style;r.setProperty('--w',innerWidth+'px');r.setProperty('--h',innerHeight+'px')}
addEventListener('resize',size);size();

const io=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6)activate(+e.target.dataset.i)});
},{root:feed,threshold:[.6]});

function build(list){
  files=list;cur=0;
  [...feed.children].forEach(s=>{if(s._u)URL.revokeObjectURL(s._u)});
  feed.innerHTML='';
  list.forEach((f,i)=>{
    const s=document.createElement('section');s.dataset.i=i;
    const v=document.createElement('video');
    v.playsInline=true;v.preload='metadata';v.muted=muted;
    v.addEventListener('ended',()=>next());
    v.addEventListener('timeupdate',()=>{if(i===cur&&v.duration)prog.style.width=(v.currentTime/v.duration*100)+'%'});
    const c=document.createElement('div');c.className='cap';c.textContent=f.name;
    s.append(v,c);
    s.addEventListener('click',()=>toggle(v));
    feed.appendChild(s);io.observe(s);
  });
  empty.style.display=list.length?'none':'flex';
  feed.scrollTop=0;
  if(list.length)activate(0);
}
function setSrc(s,on){
  const v=s.firstChild;
  if(on&&!s._u){s._u=URL.createObjectURL(files[+s.dataset.i]);v.src=s._u}
  if(!on&&s._u){v.pause();v.removeAttribute('src');v.load();URL.revokeObjectURL(s._u);s._u=null}
}
function activate(i){
  cur=i;
  [...feed.children].forEach((s,j)=>{
    setSrc(s,Math.abs(j-i)<=1);
    const v=s.firstChild;
    if(j===i){v.muted=muted;v.currentTime=0;const p=v.play();if(p)p.catch(()=>{});}
    else v.pause();
  });
}
function toggle(v){
  if(v.paused){v.play();flash('▶')}else{v.pause();flash('⏸')}
}
function flash(t){pp.textContent=t;pp.classList.add('show');setTimeout(()=>pp.classList.remove('show'),450)}
function next(){const n=feed.children[cur+1];if(n)n.scrollIntoView({behavior:'smooth'});else{const v=feed.children[cur].firstChild;v.currentTime=0;v.play()}}

function pick(list,append){
  const v=[...list].filter(isVid).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(!v.length)return;
  build(append?files.concat(v):v);
}
let adding=false;
$('fVid').onchange=e=>{pick(e.target.files,adding);e.target.value=''};
$('fDir').onchange=e=>{pick(e.target.files,adding);e.target.value=''};
$('bPick').onclick=()=>{adding=false;$('fVid').click()};
$('bFolder').onclick=()=>{adding=false;$('fDir').click()};
$('bAdd').onclick=()=>{adding=files.length>0;$('fVid').click()};
$('bShuf').onclick=()=>{
  if(!files.length)return;
  const a=files.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  build(a);
};
$('bFit').onclick=e=>{const f=document.body.classList.toggle('fill');e.target.textContent=f?'Fill':'Fit';e.target.classList.toggle('on',f)};
$('bRot').onclick=e=>{e.target.classList.toggle('on',document.body.classList.toggle('rot'))};
$('bMute').onclick=e=>{
  muted=!muted;e.target.textContent=muted?'🔇':'🔊';
  const v=feed.children[cur]&&feed.children[cur].firstChild;if(v)v.muted=muted;
};
</script>
</body>
</html>
